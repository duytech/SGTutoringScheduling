<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bright Path — Today</title>
  <style>
    :root {
      --error: #b3261e;
      --error-bg: #fceceb;
      --warn: #8a5a00;
      --warn-bg: #fdf3e2;
      --line: #d9d9d9;
      --muted: #666;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: #1b1b1b;
      background: #fafafa;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      display: flex;
      gap: 16px;
      align-items: baseline;
      flex-wrap: wrap;
    }
    h1 { font-size: 18px; margin: 0; }
    .muted { color: var(--muted); }
    main { padding: 20px; max-width: 1100px; margin: 0 auto; }

    #banner { margin-bottom: 20px; }
    .conflict {
      border-left: 4px solid var(--error);
      background: var(--error-bg);
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 3px;
    }
    .conflict.warn {
      border-left-color: var(--warn);
      background: var(--warn-bg);
    }
    .conflict .tag {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: .03em;
    }
    .conflict .ids { color: var(--muted); font-size: 13px; }
    .ok { color: #1a7f37; }

    .loads { margin-bottom: 20px; font-size: 14px; }
    .loads .over { color: var(--error); font-weight: 600; }

    .rooms {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .room {
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      overflow: hidden;
    }
    .room h2 {
      font-size: 14px;
      margin: 0;
      padding: 8px 12px;
      background: #f0f0f0;
      border-bottom: 1px solid var(--line);
    }
    .lesson { padding: 8px 12px; border-bottom: 1px solid #eee; }
    .lesson:last-child { border-bottom: 0; }
    .lesson.clash { background: var(--error-bg); border-left: 3px solid var(--error); }
    .lesson .time { font-variant-numeric: tabular-nums; font-weight: 600; }
    .lesson .who { font-size: 13px; }
    .lesson .badges { margin-top: 3px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      background: var(--error);
      color: #fff;
      margin-right: 4px;
    }
    .badge.pair { background: #45505f; }
    .badge.cancelled { background: #999; }
    .badge.moved { background: #8a5a00; }
    .empty { padding: 8px 12px; color: var(--muted); font-size: 13px; }

    #changes { margin-bottom: 20px; }
    #changes h2 { font-size: 14px; margin: 0 0 6px; }
    .change {
      border-left: 4px solid var(--warn);
      background: var(--warn-bg);
      padding: 8px 12px;
      margin-bottom: 6px;
      border-radius: 3px;
      font-size: 14px;
    }
    .change .when { color: var(--muted); font-size: 12px; }
    .lesson.moved-late { border-left: 3px solid var(--warn); }
  </style>
</head>
<body>
  <header>
    <h1>Bright Path Learning Centre</h1>
    <span class="muted">Room board for</span>
    <input type="date" id="date" />
    <span class="muted" id="status"></span>
  </header>
  <main>
    <div id="banner"></div>
    <div id="changes"></div>
    <div class="loads" id="loads"></div>
    <div class="rooms" id="rooms"></div>
  </main>

  <script>
    const dateInput = document.getElementById("date");
    const banner = document.getElementById("banner");
    const changes = document.getElementById("changes");
    const loads = document.getElementById("loads");
    const rooms = document.getElementById("rooms");
    const status = document.getElementById("status");

    function fmt(t) { return (t || "").slice(0, 5); }

    // The board's default day. Matches Schedule:Now in appsettings.json — the
    // server no longer supplies a default, GET /api/schedule needs an explicit date.
    const PINNED_TODAY = "2026-03-06";

    async function load(date) {
      status.textContent = "loading…";
      const url = `/api/schedule?date=${date || PINNED_TODAY}`;
      const res = await fetch(url);
      if (!res.ok) { status.textContent = "failed to load"; return; }
      const data = await res.json();
      dateInput.value = data.date;
      status.textContent = data.isMonday ? "centre closed (Monday)" : "";
      renderBanner(data.conflicts);
      renderChanges(data.changes, data.date);
      renderLoads(data.tutorLoads);
      renderRooms(data.rooms);
    }

    function renderChanges(events, day) {
      if (!events || !events.length) { changes.innerHTML = ""; return; }
      changes.innerHTML = `<h2>Changes since 16:00 the day before — tell the tutors</h2>` +
        events.map(e => {
          const from = `${e.fromDate === day ? "" : e.fromDate + " "}${fmt(e.fromStartTime)} ${e.fromRoomId}`;
          const to = `${e.toDate === day ? "" : e.toDate + " "}${fmt(e.toStartTime)} ${e.toRoomId}`;
          let detail;
          if (e.fromDate === day && e.toDate === day) detail = `re-slotted ${from.trim()} → ${to.trim()}`;
          else if (e.toDate === day) detail = `moved here from ${from.trim()}`;
          else detail = `moved off this day to ${to.trim()}`;
          return `<div class="change">
            <strong>${e.lessonId}</strong> ${detail}${e.reason ? ` — ${escapeHtml(e.reason)}` : ""}
            <div class="when">recorded ${e.occurredAt.replace("T", " ").slice(0, 16)}</div>
          </div>`;
        }).join("");
    }

    function renderBanner(conflicts) {
      if (!conflicts.length) {
        banner.innerHTML = `<div class="conflict" style="border-left-color:#1a7f37;background:#e9f6ec">
          <span class="ok">No conflicts for this day.</span></div>`;
        return;
      }
      banner.innerHTML = conflicts.map(c => `
        <div class="conflict ${c.severity === "warning" ? "warn" : ""}">
          <span class="tag">${c.code}</span> — ${escapeHtml(c.message)}
          <div class="ids">bookings: ${c.bookingIds.join(", ")}</div>
        </div>`).join("");
    }

    function renderLoads(tutorLoads) {
      if (!tutorLoads.length) { loads.textContent = ""; return; }
      loads.innerHTML = "Tutor load today: " + tutorLoads.map(t =>
        `<span class="${t.overLimit ? "over" : ""}">${escapeHtml(t.tutorName)} ${t.lessonCount}/${t.limit}</span>`
      ).join(" · ");
    }

    function renderRooms(roomList) {
      rooms.innerHTML = roomList.map(room => `
        <div class="room">
          <h2>${escapeHtml(room.roomName)}</h2>
          ${room.lessons.length
            ? room.lessons.map(renderLesson).join("")
            : `<div class="empty">no lessons</div>`}
        </div>`).join("");
    }

    function renderLesson(l) {
      const clash = l.conflictCodes.length > 0;
      const badges = [
        ...l.conflictCodes.map(c => `<span class="badge">${c}</span>`),
        l.groupId ? `<span class="badge pair">exam pair</span>` : "",
        l.movedAfterCutoff ? `<span class="badge moved">moved late</span>` : "",
        l.status !== "Booked" ? `<span class="badge cancelled">${l.status}</span>` : "",
      ].join("");
      const cls = clash ? "clash" : (l.movedAfterCutoff ? "moved-late" : "");
      return `
        <div class="lesson ${cls}">
          <span class="time">${fmt(l.startTime)}–${fmt(l.endTime)}</span>
          <div class="who">${escapeHtml(l.studentName)} · ${escapeHtml(l.tutorName)}</div>
          ${badges ? `<div class="badges">${badges}</div>` : ""}
        </div>`;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    dateInput.addEventListener("change", () => load(dateInput.value || PINNED_TODAY));
    load(PINNED_TODAY);
  </script>
</body>
</html>
